<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나그네</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Nanum+Pen+Script&display=swap">
<style>
:root{--sky:#0b1020;--text:#e9dcc8;--ember:#ff9a3c;--btn-bg:rgba(20,14,10,.55);box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--sky);color:var(--text);font-family:"Gowun Batang","Noto Serif KR","Apple SD Gothic Neo",serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ui{pointer-events:none;position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 16px calc(20px + env(safe-area-inset-bottom,0px))}
.msg{font-size:1.05rem;letter-spacing:.04em;opacity:0;transition:opacity 2.4s;text-align:center;margin:0;padding:7px 16px;max-width:92vw;border-radius:18px;background:rgba(20,14,10,.58);backdrop-filter:blur(4px);text-shadow:0 0 3px #000,0 1px 6px #000}.msg:empty{display:none}
.msg.on{opacity:1}
button,input{pointer-events:auto;font:inherit;color:var(--text);background:var(--btn-bg);border:1px solid rgba(255,190,120,.35);border-radius:999px;padding:10px 22px;cursor:pointer;backdrop-filter:blur(4px)}
input{cursor:text;width:9em;text-align:center}
button:hover{border-color:rgba(255,190,120,.7)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
.top{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;width:fit-content;max-width:calc(100% - 150px);margin:0 auto;padding:6px 16px;box-sizing:border-box;text-align:center;font-size:.95rem;line-height:1.35;opacity:1;letter-spacing:.06em;border-radius:18px;background:rgba(20,14,10,.66);backdrop-filter:blur(4px);text-shadow:0 0 3px #000,0 1px 6px #000;pointer-events:none}
.tabs{position:fixed;top:calc(48px + env(safe-area-inset-top,0px));left:10px;z-index:5;display:none;flex-direction:column;align-items:stretch;gap:8px;pointer-events:none}
.tabs.open{display:flex}
.tabs button{padding:8px 16px;font-size:.9rem;text-align:left;white-space:nowrap}
.tabtog{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:10px;z-index:5;padding:5px 13px;font-size:.95rem;opacity:.9}
body.folded .tabtog{display:none}
.tabs button[aria-pressed=true],.chatrow button[aria-pressed=true]{border-color:rgba(255,190,120,.9);background:rgba(70,40,15,.75)}
.log{position:fixed;left:12px;top:calc(56px + env(safe-area-inset-top,0px));max-width:62vw;font-size:.82rem;pointer-events:none;display:flex;flex-direction:column;align-items:flex-start;gap:4px;z-index:2}
.log.typing{position:static;max-width:92vw;width:min(92vw,420px);z-index:auto}
.log div{padding:3px 10px;border-radius:12px;background:rgba(20,14,10,.5);border-left:2px solid var(--ember);text-shadow:0 1px 3px #000;opacity:.92;transition:opacity 1.2s;word-break:break-all}
.log div.fade{opacity:0}
.log b{font-weight:400;color:var(--ember);margin-right:6px;font-size:.78rem}
.chatrow{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;pointer-events:none}
.skysay{position:fixed;left:0;right:0;top:34%;max-width:80vw;margin:0 auto;text-align:center;font-size:1rem;letter-spacing:.03em;color:#fff4e0;text-shadow:0 1px 6px #000;opacity:0;transition:opacity .7s;pointer-events:none}
.skysay.on{opacity:.95}
#nick{width:7em;padding:10px 12px}
select{pointer-events:auto;font:inherit;color:var(--text);background:var(--btn-bg);border:1px solid rgba(255,190,120,.35);border-radius:999px;padding:10px 12px;cursor:pointer}
option{background:#1a120d;color:#e9dcc8}
.chatrow button{padding:10px 16px}
.fold{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:10px;z-index:5;padding:5px 13px;font-size:.8rem;opacity:.85}
body.folded .tabs,body.folded .ui .msg{display:none}
body.folded .ui .chatrow>*:not(#sky){display:none!important}
body.folded .ui .chatrow:not(:has(#sky)){display:none}
body.folded.skyon #sky{display:none!important}
body.folded.skyon .ui .chatrow:has(#sky){display:none!important}
@media(max-width:520px){.ui{gap:6px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}.chatrow{gap:6px}.chatrow button,select,#nick{padding:7px 13px;font-size:.88rem}.tabs{gap:6px}.tabs button{padding:5px 11px;font-size:.82rem}.msg{font-size:.95rem}}
.sandpad{flex-basis:100%;flex-direction:column;align-items:center;gap:6px;pointer-events:none;max-width:96vw}
#sandin{width:12em;text-align:center}
#shapes .chatrow{gap:5px}
#shapes button{padding:6px 10px;font-size:.9rem;min-width:2.2em}
#shapes button[data-k=carve]{padding:8px 18px;font-size:1rem;border-color:rgba(255,190,120,.9);background:rgba(70,40,15,.75)}
#start{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px calc(16px + env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px));box-sizing:border-box;overflow-y:auto;background:linear-gradient(rgba(5,8,20,.5),rgba(13,16,34,.4) 55%,rgba(26,15,12,.55));-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);transition:opacity .7s}
#start.off{opacity:0;pointer-events:none}
#start h1{margin:0;font-size:3rem;font-weight:400;letter-spacing:.35em;text-indent:.35em;text-shadow:0 0 18px rgba(255,150,60,.5)}
#start p{margin:0;opacity:.7;letter-spacing:.08em;text-align:center}
#start .sglass{width:min(360px,100%);box-sizing:border-box;padding:16px;border-radius:26px;display:flex;flex-direction:column;gap:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,220,180,.22);box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#start .picks{display:flex;flex-direction:column;gap:8px}
#start .picks button{width:100%;padding:10px 14px;border-radius:16px;display:grid;grid-template-columns:2rem 1fr;column-gap:12px;row-gap:2px;align-items:center;text-align:left;background:rgba(30,20,14,.35)}
#start .picks button[aria-pressed=true]{border-color:rgba(255,190,120,.95);background:rgba(90,50,20,.55);box-shadow:0 0 14px rgba(255,150,60,.25)}
#start .picks i{grid-row:1/3;font-style:normal;font-size:1.5rem;text-align:center}
#start .picks b{font-weight:400;font-size:1.05rem;letter-spacing:.04em}
#start .picks span{font-size:.82rem;opacity:.7;line-height:1.4}
#start .nl{font-size:.82rem;opacity:.7;letter-spacing:.08em;margin:2px 0 -6px 4px}
#start #startnick{width:100%;box-sizing:border-box;padding:11px 14px;border-radius:14px;text-align:left;font-size:1rem;cursor:text;background:rgba(0,0,0,.28);border-color:rgba(255,220,180,.3)}
#start .go{padding:14px;border-radius:16px;font-size:1.05rem;font-weight:600;border:0;color:#2a1606;background:linear-gradient(#ffb866,#fb9248);box-shadow:0 4px 18px rgba(255,150,60,.35)}
#start .go2{padding:11px;border-radius:16px;font-size:.95rem;background:transparent;border-color:rgba(255,220,180,.35)}
#start .gobtns{display:flex;flex-direction:column;gap:8px;margin-top:4px}
@media(max-height:700px){#start h1{font-size:2.2rem}#start{gap:12px}}
#start::before{content:"";position:absolute;inset:0;pointer-events:none;animation:stw 5s ease-in-out infinite alternate;background-image:radial-gradient(1.5px 1.5px at 8% 14%,#fff,transparent),radial-gradient(1px 1px at 17% 38%,#fff,transparent),radial-gradient(2px 2px at 29% 9%,#ffe9c8,transparent),radial-gradient(1px 1px at 41% 27%,#fff,transparent),radial-gradient(1.5px 1.5px at 56% 12%,#fff,transparent),radial-gradient(1px 1px at 68% 33%,#ffe9c8,transparent),radial-gradient(2px 2px at 79% 16%,#fff,transparent),radial-gradient(1px 1px at 91% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 94% 8%,#fff,transparent),radial-gradient(1px 1px at 5% 52%,#fff,transparent),radial-gradient(1px 1px at 86% 55%,#fff,transparent)}
#start::after{content:"";position:absolute;left:50%;bottom:-20vh;width:110vmax;height:65vh;transform:translateX(-50%);pointer-events:none;background:radial-gradient(ellipse at 50% 100%,rgba(255,140,50,.38),transparent 65%);animation:sglow 3.2s ease-in-out infinite alternate}
#start>*{position:relative;z-index:1}
@keyframes stw{from{opacity:.4}to{opacity:1}}
@keyframes sglow{from{opacity:.6}to{opacity:1}}
@media(prefers-reduced-motion:reduce){#start::before,#start::after{animation:none}}
#trkTop{position:fixed;left:0;right:0;top:calc(78px + env(safe-area-inset-top,0px));z-index:6;display:none;flex-direction:column;align-items:center;gap:8px;padding:0 12px;pointer-events:none}
#trkTop button{pointer-events:auto}
.ui button#trkb[data-ic]{font-size:.95rem!important;min-width:0;padding:8px 16px;display:inline-flex;align-items:center;gap:6px;border-color:rgba(255,190,120,.9);background:rgba(70,40,15,.75)}
.ui button#trkb[data-ic]::before{font-size:1.15rem}
#trkOrd{padding:11px 26px;font-size:1.05rem;letter-spacing:.04em;border-color:rgba(255,190,120,.9);background:rgba(70,40,15,.82);box-shadow:0 2px 14px rgba(0,0,0,.45);animation:trkpulse 1.6s ease-in-out infinite alternate}
#trkOrd[aria-expanded=true]{animation:none}
#trkOut{padding:9px 22px;font-size:.98rem;letter-spacing:.04em;border-color:rgba(255,220,180,.6);background:rgba(20,14,10,.72);box-shadow:0 2px 12px rgba(0,0,0,.4)}
#trkTop .chatrow{gap:8px}
#trkTop .chatrow button{padding:10px 18px;font-size:1rem}
@keyframes trkpulse{from{box-shadow:0 2px 10px rgba(0,0,0,.45)}to{box-shadow:0 0 18px rgba(255,170,80,.75)}}
@media(prefers-reduced-motion:reduce){#trkOrd{animation:none}}
body.folded #trkTop{display:none!important}
#vig{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1.4s;background:radial-gradient(ellipse at 50% 42%,rgba(0,0,0,0) 42%,rgba(2,5,12,.62) 100%)}
/* 아이콘 버튼: 글자는 그대로 두고 화면에는 아이콘만 보여줘요 */
.ui button[data-ic],.fold[data-ic]{font-size:0!important;padding:7px 12px;min-width:2.6em;line-height:1}
.ui button[data-ic]::before,.fold[data-ic]::before{content:attr(data-ic);font-size:1.3rem;line-height:1}
@media(max-width:520px){.ui button[data-ic]{padding:5px 10px;min-width:2.4em}.ui button[data-ic]::before{font-size:1.2rem}}
#fpb.fpblink{animation:fpblink .8s ease-in-out 2}
@keyframes fpblink{0%,100%{border-color:rgba(255,190,120,.35);background:var(--btn-bg)}50%{border-color:rgba(255,200,130,1);background:rgba(120,70,25,.9)}}
#shapes #hangbtn{padding:10px 18px;font-size:1rem;border-color:rgba(255,190,120,.9);background:rgba(70,40,15,.75)}

.cambtn{position:fixed;top:calc(48px + env(safe-area-inset-top,0px));right:10px;z-index:5;padding:6px 12px;font-size:1.15rem;line-height:1;opacity:.9}
body.folded .cambtn{display:none}
.helpbtn{position:fixed;top:calc(88px + env(safe-area-inset-top,0px));right:10px;z-index:5;padding:6px 12px;font-size:1rem;line-height:1;opacity:.9;min-width:2.4em}
.helpbtn[aria-expanded=true]{border-color:rgba(255,190,120,.9);background:rgba(70,40,15,.75)}
body.folded .helpbtn,body.folded #guide{display:none!important}
#guide{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:7;display:none;flex-direction:column;gap:10px;box-sizing:border-box;width:min(330px,calc(100vw - 24px));max-height:calc(100vh - 48px);max-height:calc(100dvh - 48px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding:12px;border-radius:18px;background:rgba(20,14,10,.9);backdrop-filter:blur(6px);box-shadow:0 8px 28px rgba(0,0,0,.5);pointer-events:auto;text-shadow:0 1px 3px #000}
#guide.on{display:flex}
#guide.fbmode .gfb{display:flex}
#guide #fblist{display:flex;flex-direction:column;gap:6px;max-height:42vh;overflow-y:auto;overscroll-behavior:contain;font-size:.82rem;line-height:1.4;text-align:left}
#guide #fblist:empty{display:none}
#guide #fblist div{padding:6px 8px;border-radius:10px;background:rgba(255,255,255,.07)}
#guide #fblist small{display:block;opacity:.55;font-size:.72rem}
#guide.fbmode .gbody{display:none}
#guide h2{margin:0;font-size:1rem;font-weight:400;letter-spacing:.06em;text-align:center}
#guide .gtabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
#guide .gtabs button{padding:5px 11px;font-size:.85rem}
#guide .gtabs button[aria-pressed=true]{border-color:rgba(255,190,120,.9);background:rgba(70,40,15,.75)}
#guide .gbody{overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:12px;padding-right:2px}
#guide h3{margin:0 0 6px;font-size:.85rem;font-weight:400;color:var(--ember);letter-spacing:.08em}
#guide ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
#guide li{display:flex;gap:9px;align-items:flex-start;font-size:.88rem;line-height:1.45}
#guide li i{font-style:normal;flex:0 0 1.6em;text-align:center;font-size:1.05rem;line-height:1.3}
#guide li b{font-weight:400;color:#fff4e0}
#guide li span{opacity:.82}
#guide .gnote{margin:0;font-size:.78rem;opacity:.6;text-align:center;line-height:1.4}
#guide .gfb{display:none;flex-direction:column;gap:4px;border-top:1px solid rgba(255,190,120,.2);padding-top:10px}
#guide .gfbrow{display:flex;gap:6px}
#guide #fbin{flex:1;min-width:0;width:auto;text-align:left;padding:8px 12px;font-size:.85rem}
#guide #fbsend{padding:8px 14px;font-size:.85rem;white-space:nowrap}
#guide #fbmsg:empty{display:none}
#flash{position:fixed;inset:0;z-index:60;background:#fff;opacity:0;pointer-events:none}
#flash.on{animation:camflash .45s ease-out}
@keyframes camflash{0%{opacity:.85}100%{opacity:0}}
#polaroid{position:fixed;inset:0;z-index:61;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(5,6,12,.55);padding:16px;box-sizing:border-box}
#polaroid.on{display:flex}
#polaroid .pol{max-width:min(88vw,520px);max-height:68vh;width:auto;height:auto;border-radius:3px;box-shadow:0 14px 40px rgba(0,0,0,.6);transform:rotate(-2.5deg);animation:poldrop .7s cubic-bezier(.2,.9,.3,1.1)}
#polaroid .pol.dev{animation:poldrop .7s cubic-bezier(.2,.9,.3,1.1)}
@keyframes poldrop{0%{transform:translateY(-60vh) rotate(8deg);opacity:0}100%{transform:translateY(0) rotate(-2.5deg);opacity:1}}
#polaroid .row{display:flex;gap:10px}
#polcap{width:min(78vw,320px);text-align:center}
/* 활동 메뉴: 버튼들을 한 곳에 모아 글자와 함께 보여줘요 */
#actrow{display:none}
.ui.actopen #actrow{display:flex;flex-direction:column;align-items:stretch;gap:6px;pointer-events:auto;max-height:42vh;overflow-y:auto;padding:8px;border-radius:18px;background:rgba(20,14,10,.8);backdrop-filter:blur(6px);min-width:190px;max-width:88vw}
.ui #actrow button{text-align:left;white-space:nowrap}
.ui #actrow button[data-ic]{font-size:.95rem!important;padding:9px 16px;min-width:0;align-items:center;gap:10px}
.ui #actrow button[data-ic]::before{font-size:1.15rem}
.ui.actopen #actrow button[data-ic]:not([style*="display: none"]){display:flex}
#acttog{padding:10px 16px}
#mainrow{gap:6px}
#mainrow button{padding:6px 10px;font-size:.95rem}
#mainrow button[data-ic]{min-width:2.4em;padding:6px 10px}
#sandrow:not(:has(#shapes:not([style*="display: none"]):not([style*="display:none"]))){display:none!important}
body.lying #sandbtn,body.lying #tea,body.lying #yam,body.lying #loyb{display:none!important}
#mainrow:not(:has(>button:not([style*="display: none"]):not([style*="display:none"]))){display:none}
#setrow{display:none}
.ui.setopen #setrow{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;pointer-events:auto;padding:8px;border-radius:18px;background:rgba(20,14,10,.8);backdrop-filter:blur(6px);max-width:88vw}
#settog{padding:10px 14px}
/* 누워 있을 땐 먹고 마시고 이동하는 버튼은 숨겨요 (음악·멍때리기·하늘 보기·채팅은 그대로) */
body.lying #actrow>button:not(#mus):not(#zone):not(#pntb),body.lying #sit,body.lying #gob,body.lying #lhb,body.lying #gorow,body.lying #sandrow,body.lying #sitrow{display:none!important}
.ui.setopen #settog{border-color:rgba(255,190,120,.9);background:rgba(70,40,15,.75)}
body.folded #setrow{display:none!important}
.ui.actopen #acttog{border-color:rgba(255,190,120,.9);background:rgba(70,40,15,.75)}
body.folded #actrow{display:flex!important;flex-direction:row;background:none;padding:0;max-height:none;overflow:visible;min-width:0;backdrop-filter:none}
body.folded .ui #actrow button[data-ic]{font-size:0!important;padding:7px 12px;min-width:2.6em;display:inline-block}
body.folded .ui #actrow button[data-ic]::before{font-size:1.3rem}
@media(max-width:520px){#acttog{padding:7px 13px}}
</style>
</head>
<body>
<canvas id="c" aria-label="3D 휴식 공간"></canvas>
<div id="vig"></div><div id="flash"></div><div id="polaroid" role="dialog" aria-label="폴라로이드 사진"><img class="pol" id="polimg" alt="찍은 사진"><input id="polcap" maxlength="16" placeholder="사진에 쓸 글 (최대 16자)" aria-label="사진에 쓸 글" autocomplete="off"><div class="row"><button type="button" id="polsave">저장</button><button type="button" id="polclose">닫기</button></div></div>
<div id="start" role="dialog" aria-label="입장하기"><h1>나그네</h1><p>잠깐, 어디서 쉬어갈래요?</p><div class="sglass"><div class="picks" id="picks"><button type="button" data-s="fire" aria-pressed="true"><i>🔥</i><b>숲속 캠핑 불멍</b><span>타닥타닥 모닥불 앞에서 조용히 불을 바라봐요</span></button><button type="button" data-s="beach" aria-pressed="false"><i>🌊</i><b>바닷가 물멍</b><span>파도 소리를 듣고 모래에 편지를 써요</span></button><button type="button" data-s="cabin" aria-pressed="false"><i>❄️</i><b>눈 오는 오두막</b><span>눈 내리는 밤, 따뜻한 오두막에서 쉬어요</span></button><button type="button" data-s="cinema" aria-pressed="false"><i>🎬</i><b>별빛 영화관</b><span>별 아래 큰 스크린 앞에서 영상을 봐요</span></button></div><label class="nl" for="startnick">닉네임</label><input id="startnick" maxlength="8" placeholder="나그네" aria-label="닉네임" autocomplete="off"><div class="gobtns"><button type="button" id="goon" class="go">🔊 소리 켜고 들어가기</button><button type="button" id="gooff" class="go2">🔇 끄고 들어가기</button></div></div></div>

var cinOn=false,cinWrap=null,cinFr=null,cinPaused=false,CIN_C=[[-CIN_W/2,CIN_Y+CIN_H/2],[CIN_W/2,CIN_Y+CIN_H/2],[CIN_W/2,CIN_Y-CIN_H/2],[-CIN_W/2,CIN_Y-CIN_H/2]];

function cinHomog(d){   // 960x540 사각형 → 화면 위 네 점(d)으로 보내는 변환
  var s=[[0,0],[960,0],[960,540],[0,540]],A=[],b=[],i,j,k;
  for(i=0;i<4;i++){var x=s[i][0],y=s[i][1],X=d[i][0],Y=d[i][1];
    A.push([x,y,1,0,0,0,-x*X,-y*X]);b.push(X);
    A.push([0,0,0,x,y,1,-x*Y,-y*Y]);b.push(Y);}
  for(i=0;i<8;i++){var p=i;for(j=i+1;j<8;j++)if(Math.abs(A[j][i])>Math.abs(A[p][i]))p=j;
    var t=A[i];A[i]=A[p];A[p]=t;var tb=b[i];b[i]=b[p];b[p]=tb;
    if(Math.abs(A[i][i])<1e-9)return null;
    for(j=i+1;j<8;j++){var f=A[j][i]/A[i][i];for(k=i;k<8;k++)A[j][k]-=f*A[i][k];b[j]-=f*b[i];}}
  var h=[];for(i=7;i>=0;i--){var sum=b[i];for(j=i+1;j<8;j++)sum-=A[i][j]*h[j];h[i]=sum/A[i][i];}
  return h;
}

function startAudio(){

  ac=new AC();master=ac.createGain();master.gain.value=0;master.connect(ac.destination);
  var len=ac.sampleRate*2,xf=Math.floor(ac.sampleRate*.3),tmp=new Float32Array(len+xf),last=0;
  for(var i=0;i<len+xf;i++){var w=Math.random()*2-1;last=(last+.02*w)/1.02;tmp[i]=last*3.2;}

  for(var i1=0;i1<xf;i1++){var fk=i1/xf*Math.PI/2;d[i1]=tmp[i1]*Math.sin(fk)+tmp[len+i1]*Math.cos(fk);}

  lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=scene==='cabin'?450:900;
  var hpb=ac.createBiquadFilter();hpb.type='highpass';hpb.frequency.value=120;
  baseG=ac.createGain();baseG.gain.value=scene==='beach'?.12:.7;s.connect(lp);lp.connect(hpb);hpb.connect(baseG);baseG.connect(master);s.start();
  var wb=ac.createBuffer(1,len,ac.sampleRate),wd=wb.getChannelData(0);for(var i2=0;i2<len;i2++)wd[i2]=(Math.random()*2-1)*.5;
  var s2=ac.createBufferSource();s2.buffer=wb;s2.loop=true;wlp=ac.createBiquadFilter();wlp.type='lowpass';wlp.frequency.value=900;wg=ac.createGain();wg.gain.value=0;s2.connect(wlp);wlp.connect(wg);wg.connect(master);s2.start();
  var rs2=ac.createBufferSource();rs2.buffer=wb;rs2.loop=true;var rhp=ac.createBiquadFilter();rhp.type='highpass';rhp.frequency.value=1800;var rg2=ac.createGain();rg2.gain.value=0;rs2.connect(rhp);rhp.connect(rg2);rg2.connect(master);rs2.start();
  setInterval(function(){if(ac)rg2.gain.setTargetAtTime(scene==='fire'?.5*rainK:0,ac.currentTime,.3);},150);
  setInterval(function(){if(!ac)return;var tw2=Date.now()/1000,v=.5*(.5+.5*Math.sin(tw2*.55))+.5*(.5+.5*Math.sin(tw2*.31+1.7));wg.gain.setTargetAtTime(scene==='beach'?.08+.6*v*v:0,ac.currentTime,.25);wlp.frequency.setTargetAtTime(400+1600*v,ac.currentTime,.25);},120);
  (function pop(){
    if(ac&&scene!=='cabin'&&scene!=='beach'){
      var o=ac.createBufferSource(),bb=ac.createBuffer(1,ac.sampleRate*.05,ac.sampleRate),dd=bb.getChannelData(0);
      for(var j=0;j<dd.length;j++)dd[j]=(Math.random()*2-1)*Math.pow(1-j/dd.length,3);
      o.buffer=bb;var hp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=1200+Math.random()*2500;
      var gn=ac.createGain();gn.gain.value=.15+Math.random()*.35;o.connect(hp);hp.connect(gn);gn.connect(master);o.start();
    }
    setTimeout(pop,80+Math.random()*(Math.random()<.2?900:380));
  })();
}

      ['▶️','영상 틀기','아래 칸에 유튜브 링크를 붙여넣고 틀기. 멈춤 · 끄기도 돼요. 같은 방 사람에게 [같이 보기] 버튼이 떠요'],
      ['📋','내 목록','자주 보는 링크를 저장해 두고 눌러서 틀어요 (이 기기에만 저장돼요)'],
      ['🎬','빔프로젝터','삼각대 위 빔프로젝터가 스크린을 비춰요'],
      ['🪑','앉기','캠핑 의자 · 돗자리. 앞쪽 돗자리에선 눕기도 돼요'],
      ['🌌','눕기','돗자리에 누워 별을 올려다봐요']
    ]}
  };
  var C=[
    ['🚶','걷기','바닥을 눌러요. PC는 방향키/WASD'],
    ['🛌','눕기','누우면 🌌 하늘 보기. 불멍 · 바닷가에선 🖌️ 하늘에 그리기'],
    ['🧍','일어나기','앉거나 누운 걸 풀어요'],
    ['👁️','시점','1인칭 / 3인칭. 화면을 끌면 둘러봐요'],
    ['🗨️','말하기','한마디를 남겨요. 🙈로 채팅을 숨기고 💬로 다시 봐요'],
    ['📋','활동','지금 할 수 있는 것들이 모여 있어요'],
    ['⚙️','설정','닉네임 · 방 · 소리'],
    ['🔥','장소 바꾸기','왼쪽 위에서 다른 곳으로 옮겨가요'],
    ['📷','사진 찍기','지금 화면을 폴라로이드로 남겨요']
  ];
  function rows(a){var h='<ul>',i,r;for(i=0;i<a.length;i++){r=a[i];h+='<li><i>'+r[0]+'</i><div><b>'+r[1]+'</b><br><span>'+r[2]+'</span></div></li>';}return h+'</ul>';}
  function render(k){
    cur=k;var bs=gt.querySelectorAll('button'),i;for(i=0;i<bs.length;i++)bs[i].setAttribute('aria-pressed',bs[i].getAttribute('data-g')===k?'true':'false');
    gd.classList.toggle('fbmode',k==='fb');if(k==='fb'){gbd.innerHTML='';if(window.__fbLoad)window.__fbLoad();return;}
    gbd.innerHTML='<div><h3>'+G[k].t+'</h3>'+rows(G[k].r)+'</div><div><h3>어디서나</h3>'+rows(C)+'</div><p class="gnote">버튼이 안 보이면 그 자리에 가까이 가거나 앉기·눕기를 해보세요</p>';
    gbd.scrollTop=0;
  }
  function sceneKey(){var s=(typeof scene!=='undefined')?scene:'fire';return s==='beach'||s==='cabin'||s==='cinema'?s:'fire';}
  function set(v){
    if(v)render(sceneKey());
    gd.classList.toggle('on',v);hb.setAttribute('aria-expanded',v?'true':'false');
  }
  hb.addEventListener('click',function(e){e.stopPropagation();set(!gd.classList.contains('on'));});
  gt.addEventListener('click',function(e){var b=e.target.closest('button');if(b)render(b.getAttribute('data-g'));});
  document.addEventListener('pointerdown',function(e){if(gd.classList.contains('on')&&!gd.contains(e.target)&&e.target!==hb)set(false);},true);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')set(false);});
  function show(){var hide=(st&&!st.classList.contains('off'));var v=hide?'none':'';if(hb.style.display!==v)hb.style.display=v;if(hide&&gd.classList.contains('on'))set(false);}
  // 한마디 남기기: posts 표에 kind='feedback'으로 쌓여요 (Supabase 표에서 확인)
  var fi=document.getElementById('fbin'),fs=document.getElementById('fbsend'),fm=document.getElementById('fbmsg');
  function fbSay(t){fm.textContent=t;}
  function fbSend(){
    var t=(fi.value||'').trim();if(!t){fbSay('내용을 적어주세요');return;}
    if(typeof SH==='undefined'){fbSay('지금은 보낼 수 없어요');return;}
    fs.disabled=true;
    SH.send('feedback',{t:t.slice(0,200),n:(typeof me!=='undefined'&&me.name)||'',sc:sceneKey(),ts:Date.now()},function(id){
      fs.disabled=false;
      if(id){fi.value='';fbSay('고마워요! 잘 전달됐어요 🙏');if(window.__fbLoad)window.__fbLoad();}
      else fbSay('못 보냈어요 · '+((SH.err||'').slice(0,80)||'잠시 후 다시 눌러줘요'));
    });
  }
  fs.addEventListener('click',fbSend);
  // 한마디 탭을 열면 모두가 남긴 글이 최근 순으로 보여요
  var ADM='';
  window.__fbLoad=function(){
    var c=window.__SB,fl=document.getElementById('fblist');if(!c||!fl)return;
    c.from('posts').select('id,body').eq('kind','feedback').order('id',{ascending:false}).limit(40).then(function(r){
      fl.innerHTML='';if(r.error||!r.data)return;
      r.data.forEach(function(x){var b=x.body||{},d=document.createElement('div'),sm=document.createElement('small'),t=b.ts?new Date(+b.ts):null;
        d.textContent=b.t||'';if(ADM){var dl=document.createElement('button');dl.type='button';dl.textContent='🗑';dl.style.cssText='float:right;padding:2px 8px;font-size:.8rem;margin-left:8px';dl.addEventListener('click',function(){if(!confirm('이 글을 지울까요?'))return;c.rpc('del_feedback',{pid:x.id,pw:ADM}).then(function(r){if(r&&r.data===true){fbSay('지웠어요');window.__fbLoad();}else{ADM='';fbSay('비밀번호가 달라요 · '+((r&&r.error&&r.error.message)||''));window.__fbLoad();}});});d.appendChild(dl);}sm.textContent=((b.n||'이름없음')+(t?' · '+(t.getMonth()+1)+'/'+t.getDate()+' '+t.getHours()+':'+('0'+t.getMinutes()).slice(-2):''));d.appendChild(sm);fl.appendChild(d);});
    },function(){});
  };
  (function(){var fl=document.getElementById('fblist'),ab=document.createElement('button');ab.type='button';ab.textContent='🔑 관리';ab.style.cssText='align-self:flex-end;padding:3px 10px;font-size:.72rem;opacity:.55';
    fl.parentNode.insertBefore(ab,fl);
    ab.addEventListener('click',function(){if(ADM){ADM='';ab.textContent='🔑 관리';window.__fbLoad();return;}var p=prompt('관리자 비밀번호');if(!p)return;ADM=p;ab.textContent='🔓 관리 끄기';window.__fbLoad();});})();
  fi.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();fbSend();}});
  gt.addEventListener('click',function(){fbSay('');});
  setInterval(show,400);
})();
})();
</script>
