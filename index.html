// Claude 안에서는 claude.use('room')을 쓰고, 밖에서는 Supabase Realtime(Presence)으로 같은 역할을 해요.
function makeSupaLobby(url,key){
  var sb=supabase.createClient(url,key,{realtime:{params:{eventsPerSecond:10}}});
  var myId='p'+Math.random().toString(36).slice(2,10);
  function mk(name,throttle){
    var ch=sb.channel(name,{config:{presence:{key:myId}}}),cur=null,ready=false,lastT=0,tm=0,o={ok:false};
    function push(){tm=0;if(!ready||!cur)return;lastT=Date.now();try{var r=ch.track(cur);if(r&&r.catch)r.catch(function(){});}catch(err){}}
    o.presence=function(p){
      cur=p;
      if(ready){var w=Date.now()-lastT;if(w>=throttle)push();else if(!tm)tm=setTimeout(push,throttle-w);}
      return Promise.resolve();
    };
    o.peers=function(){
      var st=ch.presenceState(),out=[];
      for(var k in st){var a=st[k];if(!a||!a.length)continue;out.push({peer:k,isMe:k===myId,kind:'viewer',presence:a[a.length-1]});}
      return out;
    };
    o.on=function(){return function(){};};
    o.leave=function(){clearTimeout(tm);tm=0;ready=false;o.ok=false;return Promise.resolve(sb.removeChannel(ch));};
    o.ready=new Promise(function(res,rej){
      var done=false;
      ch.subscribe(function(status){
        if(status==='SUBSCRIBED'){ready=true;o.ok=true;if(cur)push();if(!done){done=true;res(o);}}
        else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){
          ready=false;o.ok=false;console.warn('[실시간 연결 실패]',name,status);
          if(!done){done=true;try{sb.removeChannel(ch);}catch(err){}rej(new Error(status));}
        }else if(status==='CLOSED'){ready=false;o.ok=false;}
      });
    });
    return o;
  }
  var lob=mk('hy-lobby',1500);
  lob.join=function(n){return mk('hy-room-'+n,200).ready;};
  return lob;
}
