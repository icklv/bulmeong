<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나그네</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang&display=swap">
<style>
:root{--sky:#0b1020;--text:#e9dcc8;--ember:#ff9a3c;--btn-bg:rgba(20,14,10,.55);box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--sky);color:var(--text);font-family:"Gowun Batang","Noto Serif KR","Apple SD Gothic Neo",serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ui{pointer-events:none;position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 16px calc(20px + env(safe-area-inset-bottom,0px))}
.msg{font-size:1.05rem;letter-spacing:.04em;opacity:0;transition:opacity 2.4s;text-align:center;margin:0;padding:7px 16px;max-width:92vw;border-radius:18px;background:rgba(20,14,10,.58);backdrop-filter:blur(4px);text-shadow:0 0 3px #000,0 1px 6px #000}.msg:empty{display:none}
.msg.on{opacity:1}
button,input{pointer-events:auto;font:inherit;color:var(--text);background:var(--btn-bg);border:1px solid rgba(255,190,120,.35);border-radius:999px;padding:10px 22px;cursor:pointer;backdrop-filter:blur(4px)}
input{cursor:text;width:9em;text-align:center}
button:hover{border-color:rgba(255,190,120,.7)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
.top{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-size:.95rem;opacity:.92;margin:0;letter-spacing:.15em;text-shadow:0 0 4px #000,0 1px 8px #000}
.tabs{position:fixed;top:calc(48px + env(safe-area-inset-top,0px));left:10px;z-index:5;display:none;flex-direction:column;align-items:stretch;gap:8px;pointer-events:none}
.tabs.open{display:flex}
.tabs button{padding:8px 16px;font-size:.9rem;text-align:left;white-space:nowrap}
.tabtog{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:10px;z-index:5;padding:5px 13px;font-size:.95rem;opacity:.9}
body.folded .tabtog{display:none}
.tabs button[aria-pressed=true],.chatrow button[aria-pressed=true]{border-color:rgba(255,190,120,.9);background:rgba(70,40,15,.75)}
.log{position:fixed;left:12px;bottom:calc(225px + env(safe-area-inset-bottom,0px));max-width:75vw;font-size:.9rem;text-shadow:0 1px 6px #000;pointer-events:none;display:flex;flex-direction:column;gap:3px}
.chatrow{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;pointer-events:none}
.skysay{position:fixed;left:0;right:0;top:34%;max-width:80vw;margin:0 auto;text-align:center;font-size:1rem;letter-spacing:.03em;color:#fff4e0;text-shadow:0 1px 6px #000;opacity:0;transition:opacity .7s;pointer-events:none}
.skysay.on{opacity:.95}
#nick{width:7em;padding:10px 12px}
select{pointer-events:auto;font:inherit;color:var(--text);background:var(--btn-bg);border:1px solid rgba(255,190,120,.35);border-radius:999px;padding:10px 12px;cursor:pointer}
option{background:#1a120d;color:#e9dcc8}
.chatrow button{padding:10px 16px}
.fold{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:10px;z-index:5;padding:5px 13px;font-size:.8rem;opacity:.85}
body.folded .tabs,body.folded .ui .msg{display:none}
body.folded .ui .chatrow>*:not(#sky){display:none!important}
body.folded .ui .chatrow:not(:has(#sky)){display:none}
@media(max-width:520px){.ui{gap:6px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}.chatrow{gap:6px}.chatrow button,select,#nick{padding:7px 13px;font-size:.88rem}.tabs{gap:6px}.tabs button{padding:5px 11px;font-size:.82rem}.msg{font-size:.95rem}}
.sandpad{flex-basis:100%;flex-direction:column;align-items:center;gap:6px;pointer-events:none;max-width:96vw}
#sandin{width:12em;text-align:center}
#shapes .chatrow{gap:5px}
#shapes button{padding:6px 10px;font-size:.9rem;min-width:2.2em}
#shapes button[data-k=carve]{padding:8px 18px;font-size:1rem;border-color:rgba(255,190,120,.9);background:rgba(70,40,15,.75)}
#start{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px calc(16px + env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px));box-sizing:border-box;overflow-y:auto;background:linear-gradient(#050814,#0d1022 60%,#1a0f0c);transition:opacity .7s}
#start.off{opacity:0;pointer-events:none}
#start h1{margin:0;font-size:3rem;font-weight:400;letter-spacing:.35em;text-indent:.35em;text-shadow:0 0 18px rgba(255,150,60,.5)}
#start p{margin:0;opacity:.7;letter-spacing:.08em;text-align:center}
#start .picks{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
#start .picks button{width:min(240px,86vw);padding:20px 18px;border-radius:18px;display:flex;flex-direction:column;gap:8px;align-items:center;background:rgba(30,20,14,.6)}
#start .picks button:hover,#start .picks button:focus-visible{border-color:rgba(255,190,120,.95);background:rgba(70,40,15,.7)}
#startsnd{padding:9px 22px;font-size:.95rem}
#start .picks b{font-weight:400;font-size:1.15rem;letter-spacing:.06em}
#start .picks span{font-size:.88rem;opacity:.7;line-height:1.5}
#start::before{content:"";position:absolute;inset:0;pointer-events:none;animation:stw 5s ease-in-out infinite alternate;background-image:radial-gradient(1.5px 1.5px at 8% 14%,#fff,transparent),radial-gradient(1px 1px at 17% 38%,#fff,transparent),radial-gradient(2px 2px at 29% 9%,#ffe9c8,transparent),radial-gradient(1px 1px at 41% 27%,#fff,transparent),radial-gradient(1.5px 1.5px at 56% 12%,#fff,transparent),radial-gradient(1px 1px at 68% 33%,#ffe9c8,transparent),radial-gradient(2px 2px at 79% 16%,#fff,transparent),radial-gradient(1px 1px at 91% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 94% 8%,#fff,transparent),radial-gradient(1px 1px at 5% 52%,#fff,transparent),radial-gradient(1px 1px at 86% 55%,#fff,transparent)}
#start::after{content:"";position:absolute;left:50%;bottom:-20vh;width:110vmax;height:65vh;transform:translateX(-50%);pointer-events:none;background:radial-gradient(ellipse at 50% 100%,rgba(255,140,50,.38),transparent 65%);animation:sglow 3.2s ease-in-out infinite alternate}
#start>*{position:relative;z-index:1}
@keyframes stw{from{opacity:.4}to{opacity:1}}
@keyframes sglow{from{opacity:.6}to{opacity:1}}
@media(prefers-reduced-motion:reduce){#start::before,#start::after{animation:none}}
#vig{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1.4s;background:radial-gradient(ellipse at 50% 42%,rgba(0,0,0,0) 42%,rgba(2,5,12,.62) 100%)}
/* 아이콘 버튼: 글자는 그대로 두고 화면에는 아이콘만 보여줘요 */
.ui button[data-ic],.fold[data-ic]{font-size:0!important;padding:7px 12px;min-width:2.6em;line-height:1}
.ui button[data-ic]::before,.fold[data-ic]::before{content:attr(data-ic);font-size:1.3rem;line-height:1}
@media(max-width:520px){.ui button[data-ic]{padding:5px 10px;min-width:2.4em}.ui button[data-ic]::before{font-size:1.2rem}}
#shapes #hangbtn{padding:10px 18px;font-size:1rem;border-color:rgba(255,190,120,.9);background:rgba(70,40,15,.75)}

.cambtn{position:fixed;top:calc(48px + env(safe-area-inset-top,0px));right:10px;z-index:5;padding:6px 12px;font-size:1.15rem;line-height:1;opacity:.9}
body.folded .cambtn{display:none}
#flash{position:fixed;inset:0;z-index:60;background:#fff;opacity:0;pointer-events:none}
#flash.on{animation:camflash .45s ease-out}
@keyframes camflash{0%{opacity:.85}100%{opacity:0}}
#polaroid{position:fixed;inset:0;z-index:61;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(5,6,12,.55);padding:16px;box-sizing:border-box}
#polaroid.on{display:flex}
#polaroid .pol{max-width:min(88vw,520px);max-height:68vh;width:auto;height:auto;border-radius:3px;box-shadow:0 14px 40px rgba(0,0,0,.6);transform:rotate(-2.5deg);animation:poldrop .7s cubic-bezier(.2,.9,.3,1.1)}
#polaroid .pol.dev{animation:poldrop .7s cubic-bezier(.2,.9,.3,1.1)}
@keyframes poldrop{0%{transform:translateY(-60vh) rotate(8deg);opacity:0}100%{transform:translateY(0) rotate(-2.5deg);opacity:1}}
#polaroid .row{display:flex;gap:10px}
#polcap{width:min(78vw,320px);text-align:center}
</style>
</head>

<canvas id="c" aria-label="3D 휴식 공간"></canvas>
<div id="vig"></div><div id="flash"></div><div id="polaroid" role="dialog" aria-label="폴라로이드 사진"><img class="pol" id="polimg" alt="찍은 사진"><input id="polcap" maxlength="16" placeholder="사진에 쓸 글 (최대 16자)" aria-label="사진에 쓸 글" autocomplete="off"><div class="row"><button type="button" id="polsave">저장</button><button type="button" id="polclose">닫기</button></div></div>

<p class="top" id="top">나그네</p>
<button id="fold" class="fold" type="button">접기</button><button id="cam" class="cambtn" type="button" aria-label="사진 찍기" title="사진 찍기" style="display:none">📷</button>

<p class="skysay" id="skysay"></p><div class="tabs" id="tabs"><button data-s="fire" type="button">🔥 숲속 캠핑 불멍</button><button data-s="beach" type="button">🌊 바닷가 물멍</button><button data-s="cabin" type="button">❄️ 눈 오는 오두막</button></div>
<div class="log" id="log"></div>
<div class="ui"><p class="msg" id="msg"></p><div class="chatrow" id="sitrow" style="display:none"><button type="button" data-s="chair">의자에 앉기</button><button type="button" data-s="floor">바닥에 앉기</button></div><div class="chatrow"><button id="tent" type="button">텐트 들어가기</button><button id="sit" type="button">앉기</button><button id="gob" type="button" aria-pressed="false" style="display:none">이동</button><button id="lhb" type="button" style="display:none">등대 올라가기</button><button id="fpb" type="button" style="display:none">바다 보기</button><button id="lie" type="button" style="display:none">눕기</button><button id="sky" type="button" style="display:none">하늘 보기</button><button id="tea" type="button" style="display:none">차 마시기</button><button id="yam" type="button" style="display:none">고구마 굽기</button><button id="mus" type="button" style="display:none">음악 켜기</button><button id="zone" type="button" style="display:none">멍때리기</button></div><div class="chatrow" id="gorow" style="display:none"><button type="button" data-g="fire">모닥불</button><button type="button" data-g="gb">방명록 자리</button><button type="button" data-g="rain">비 오는 캠핑장</button><button type="button" data-g="cat">고양이 놀이터</button></div><div class="chatrow" id="sandrow" style="display:none"><button id="sandbtn" type="button" aria-pressed="false">모래편지</button><div class="sandpad" id="shapes" style="display:none"><div class="chatrow"><input id="sandin" maxlength="12" placeholder="새기고 싶은 말을 써요" aria-label="새길 글자" autocomplete="off"><button type="button" data-k="hang" id="hangbtn" style="display:none">걸기</button></div><div class="chatrow"><label style="display:flex;align-items:center;gap:6px;pointer-events:auto;color:var(--text)">크기<input id="sandsz" type="range" min="0.3" max="1.5" step="0.1" value="0.6" aria-label="글씨 크기" style="width:7em;padding:4px 8px"></label><button type="button" data-k="border">테두리 없음</button><button type="button" data-k="flat">모래 평평하게</button></div></div></div><div class="chatrow"><input id="nick" maxlength="8" placeholder="닉네임" aria-label="닉네임"><select id="ch" aria-label="방 선택"></select><button id="snd" type="button">소리 켜기</button></div></div>

    on=!on;window.__muted=!on;master.gain.cancelScheduledValues(ac.currentTime);
    master.gain.setTargetAtTime(on&&!musicTarget()?.55:0,ac.currentTime,.4);
    btn.textContent=on?'소리 끄기':'소리 켜기';
  }catch(err){btn.textContent='소리를 쓸 수 없어요';}
});
